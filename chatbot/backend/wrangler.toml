name = "portfolio-chatbot"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# AI binding — used for embeddings (free tier: 10k Neurons/day)
[ai]
binding = "AI"

# Environment variables (non-secret config)
[vars]
LLM_PROVIDER = "groq"
GROQ_MODEL = "openai/gpt-oss-20b"
MAX_TOKENS = "512"
TEMPERATURE = "0.3"
# PYTHON_BACKEND_URL = "https://your-app.onrender.com"  # Set this to your Render URL after deploying
ALLOWED_ORIGINS = "https://ayush-aryan1309-portfolio.vercel.app"

# API keys — set these via `npx wrangler secret put`
# npx wrangler secret put GROQ_API_KEY  ← the only key you need!

# Wrong-PIN counter for the notes viewer unlock (src/vault.ts).
# SQLite-backed Durable Objects are available on the Workers free plan.
[[durable_objects.bindings]]
name = "VAULT_LOCK"
class_name = "VaultLock"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultLock"]

# Secrets for the unlock — set with `npm run vault:secrets` from the portfolio root:
# VAULT_KEY, VAULT_PIN_HASH
